---
procyamlversion: 3.0.0-dev.0

description: XCP-D, https://xcp-d.readthedocs.io/en/latest

jobtemplate: job_template_v3.txt

containers:
  - name: xcpd
    path: xcp_d_0.7.5.sif
    source: docker://pennlinc/xcp_d:0.7.5

requirements:
  walltime: 1-0
  memory: 8000

inputs:
  xnat:
      
    filters:
      - type: match
        inputs: scan_fmri,assr_fmriprep/scan_fmri

    scans:

      - name: scan_fmri
        types: REST1_v2,REST2_v2

    assessors:
        
        - name: assr_fmriprep
          proctypes: fmriprep-notopup_v24
          resources:
            - {resource: fmriprepBIDS, ftype: DIR, fdest: fmriprepBIDS}

outputs:
  - {path: HTML, type: DIR, resource: HTML}
  - {path: xcpdBIDS, type: DIR, resource: xcpdBIDS}
  - {path: qc.csv, type: FILE, resource: QC}
  - {path: coverage.csv, type: FILE, resource: COVERAGE}
  - {path: xcpd-processors/scripts, type: DIR, resource: SCRIPTS}

command:
  type: singularity_run
  container: xcpd
  args: >-
    --work-dir /tmp
    --fs-license-file /opt/license.txt
    --skip-dcan-qc
    --smoothing 0
    --skip-parcellation
    --nuisance-regressors acompcor
    --fd-thresh 0
    --lower-bpf 0.01
    --upper-bpf 0.10
    --min-coverage 0
    /INPUTS/fmriprepBIDS/fmriprepBIDS
    /OUTPUTS/xcpdBIDS
    participant
  extraopts: --bind /data/mcr/centos7/FS6/license.txt:/opt/license.txt

post:
  type: singularity_exec
  container: xcpd
  args: >-
    bash -c '
    
    mkdir /OUTPUTS/HTML &&
    cp /OUTPUTS/xcpdBIDS/sub-*.html /OUTPUTS/HTML &&
    cp -R /OUTPUTS/xcpdBIDS/sub-* /OUTPUTS/HTML &&
    rm -fr /OUTPUTS/HTML/sub-*/ses-* &&
    
    cd /OUTPUTS &&
    curl -o xcpd-processors.tar.gz -L https://github.com/VUIIS/xcpd-processors/archive/refs/tags/v2.4.2.tar.gz &&
    tar -zxf xcpd-processors.tar.gz &&
    mv xcpd-processors-* xcpd-processors &&
    export PATH=/OUTPUTS/xcpd-processors/scripts:\$PATH &&

    custom_parcellation.py
      --fmriprep_dir /INPUTS/fmriprepBIDS/fmriprepBIDS
      --xcpd_dir /OUTPUTS/xcpdBIDS
      --space MNI152NLin6Asym
      --atlas MMPthalTian
      --min_coverage 0
      --out_dir /OUTPUTS &&

    fisher_z.py --xcpd_dir /OUTPUTS/xcpdBIDS
    
    connectivity_maps.py
      --xcpd_dir /OUTPUTS/xcpdBIDS
      --space MNI152NLin6Asym
      --atlas MMPthalTian
      --seeds lh_PeEc lh_PHA1 lh_PHA2 lh_PHA3 lh_HIP_head_m lh_HIP_head_l lh_HIP_body lh_HIP_tail
              rh_PeEc rh_PHA1 rh_PHA2 rh_PHA3 rh_HIP_head_m rh_HIP_head_l rh_HIP_body rh_HIP_tail
      --saveR
      --saveZ
      --fwhm 0 4
    '
